name: Publish README

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  readme-shell:
    name: Regenerate README shell
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:44
    steps:
      - name: Install toolchain
        run: dnf install -y -q make python3 python3-pip git

      - uses: actions/checkout@v4

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up venv
        run: make setup-venv

      # No build-report.db in CI -- this only touches the branding shell
      # (logo/description/news/docs/support/license/people), never the
      # packages/build-status body. See docs/operations.md "CI docs-shell publish".
      - name: Regenerate README shell
        run: make readme-shell NO_CONTAINER=1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/README.copr.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Regenerate README shell [skip ci]"
            git push
          fi
