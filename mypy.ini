[mypy]
# Config for `make lint-mypy` (Makefile:293). Kept as its own dotfile, matching
# .flake8/.yamllint/.rpmlintrc, rather than folded into a pyproject.toml -- this
# repo is automation, not a distributable package.
ignore_missing_imports = True
exclude = ^submodules/

# Free today (verified against the tree at 1d5cdc32: zero errors beyond
# scripts/lib/copr.py:367, fixed alongside this config).
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_unreachable = True
strict_equality = True
no_implicit_reexport = True

# Every function has a real annotation, not just a partial one.
disallow_untyped_defs = True
disallow_incomplete_defs = True

# Deliberately OFF -- each unlocks a tracked cleanup, not a suppression:
#   disallow_any_generics  -- 155 errors, the bare-`dict`/`list` problem, see
#                              docs/BUGS.md BUG-0093
#   warn_return_any        -- 17 errors, `Any` laundered through annotated
#                              signatures, see docs/BUGS.md BUG-0095
# Turn one on once its TODO is done; a config that silently keeps both off
# forever is the same fake-strictness problem this file exists to fix.
