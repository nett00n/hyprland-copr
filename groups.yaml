---
_starter-pack:
  label: Hyprland new user starter-pack
  packages:
  - hypridle
  - Hyprland
  - hyprland-guiutils
  - hyprlock
  - hyprpaper
  - Hyprshot
  - Waybar
  packages_from_global_repo:
  - name: wofi
    summary: Wofi is a launcher/menu program for wlroots based wayland compositors such as sway
  - name: swaync
    summary: A simple GTK based notification daemon for any Wayland compositor
hyprland:
  badge:
    color: 33CCFF
    logo: hyprland
    logo_color: black
  label: Hyprland main packages
  packages:
  - hypridle
  - Hyprland
  - hyprland-guiutils
  - hyprland-plugins
  - hyprland-qt-support
  - hyprlauncher
  - hyprlock
  - hyprpaper
  - hyprpicker
  - hyprpolkitagent
  - hyprpwcenter
  - hyprqt6engine
  - Hyprshot
  - hyprshutdown
  - hyprsunset
  - hyprsysteminfo
  - xdg-desktop-portal-hyprland
hyprland-deps:
  badge:
    color: 33CCFF
    logo: hyprland
    logo_color: black
  label: Hyprland dependencies
  packages:
  - aquamarine
  - hyprcursor
  - hyprgraphics
  - hyprland-protocols
  - hyprland-qt-support
  - hyprlang
  - hyprtoolkit
  - hyprutils
  - hyprwayland-scanner
  - hyprwire
other-apps:
  label: Useful apps
  packages:
  - SwayOSD
  - Waybar
  - ashell
  - cliphist
  - cliphist-git
  - eww
  - greyline
  - hellwal
  - hyprland-per-window-layout
  - ironbar
  - lambdock
  - matugen
  - mpvpaper
  - neowall
  - OpenLogi
  - pyprland
  - pywal
  - pywal16
  - quickshell
  - rumno
  - rustlock
  - satty
  - snappy-switcher
  - swaylock-effects
  - swaylock-plugin
  - usbtree
  - uwsm
  - waylock
  - waypaper
  - wl-clip-persist
  - wpgtk
  packages_from_global_repo:
  - name: swaybg
    summary: Great utility if all you want is one simple static wallpaper
  - name: bemenu
    summary: Dynamic menu library and client program inspired by dmenu
  - name: fuzzel
    summary: App launcher and fuzzy finder for Wayland, inspired by rofi and dmenu
  - name: nwg-launchers
    summary: GTK-based launchers for sway and other window managers
  - name: ulauncher
    summary: Feature rich application Launcher for Linux
  - name: lavalauncher
    summary: lavalauncher is a simple launcher for Wayland
  - name: imv
    summary: Image viewer for X11 and Wayland
  - name: swayimg
    summary: Lightweight image viewer for Wayland display servers
  - name: vimiv-qt
    summary: An image viewer with vim-like keybindings
  - name: swaylock
    summary: Screen locker for Wayland
  - name: chayang
    summary: Gradually dim the screen on wlroots-based compositors
  - name: clipman
    summary: A simple clipboard manager for Wayland
  - name: copyq
    summary: CopyQ is an advanced clipboard manager with powerful editing and scripting features.
  - name: nnn
    summary: n³ The unorthodox terminal file manager
  - name: ranger
    summary: A VIM-inspired filemanager for the console
  - name: network-manager-applet
    summary: Tray applet and an advanced network connection editor
  - name: gammastep
    summary: Adjust the color temperature of your screen according to your surroundings. This may help your eyes hurt less if you are working in front of the screen at night.
  - name: udiskie
    summary: udiskie is a udisks2 front-end that allows to manage removable media such as CDs or flash drives for userspace
